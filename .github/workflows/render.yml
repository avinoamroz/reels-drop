name: render
# Parallel reel rendering. A push that adds render/jobs/<id>/job.json (+ bundle.tgz)
# starts one 4-core machine per job, up to 20 at once.
on:
  push:
    paths: ['render/jobs/*/job.json']
  workflow_dispatch:
    inputs:
      ids:
        description: 'space separated job ids to (re)render'
        required: true
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.p.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: render/jobs
      - id: p
        run: |
          if [ -n "${{ github.event.inputs.ids }}" ]; then
            ids="${{ github.event.inputs.ids }}"
          else
            before="${{ github.event.before }}"
            if git cat-file -e "$before" 2>/dev/null; then
              ids=$(git diff --name-only "$before" "${{ github.sha }}" -- 'render/jobs/*/job.json' | cut -d/ -f3 | sort -u)
            else
              ids=$(git show --name-only --format= "${{ github.sha }}" -- 'render/jobs/*/job.json' | cut -d/ -f3 | sort -u)
            fi
          fi
          json=$(printf '%s\n' $ids | grep -v '^$' | jq -R . | jq -sc .)
          echo "ids=$json" >> "$GITHUB_OUTPUT"
          echo "jobs: $json"
  render:
    needs: plan
    if: needs.plan.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            render/jobs/${{ matrix.id }}
            render/requirements.txt
            render/asr.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: render/requirements.txt
      - name: Install tools
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg fonts-inter fonts-liberation fonts-dejavu-core fonts-noto-color-emoji libcairo2 libcairo2-dev pkg-config libsndfile1 jq > /dev/null && break
            sleep 20
          done
          pip install -q --retries 5 -r render/requirements.txt
      - name: Unpack and render
        id: r
        run: |
          J=render/jobs/${{ matrix.id }}
          sudo mkdir -p /home/claude /root/.fonts
          sudo tar xzf "$J/bundle.tgz" -C /
          sudo fc-cache -f > /dev/null
          CMD=$(jq -r .cmd "$J/job.json"); OUT=$(jq -r .out "$J/job.json")
          START=$(date +%s)
          set +e
          sudo -E env "PATH=$PATH" "pythonLocation=$pythonLocation" bash -c "cd /home/claude && $CMD" > /tmp/log.txt 2>&1
          RC=$?
          set -e
          tail -60 /tmp/log.txt
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "secs=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"
          if [ $RC -eq 0 ] && sudo test -s "$OUT"; then
            sudo cp "$OUT" "${{ matrix.id }}.mp4"; sudo chown runner "${{ matrix.id }}.mp4"
            mkdir -p render/out
            ffmpeg -nostdin -v error -y -i "${{ matrix.id }}.mp4" -vf scale=540:-2 -c:v libx264 -crf 30 -preset veryfast -c:a aac -b:a 96k "render/out/${{ matrix.id }}_540.mp4"
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
      # Cloud ASR QA (added 1 Nov). Optional: every step below is continue-on-error and only
      # runs after a good render, so it can never fail or block the render result.
      - name: ASR models for this job
        id: am
        if: steps.r.outputs.ok == '1'
        continue-on-error: true
        run: |
          J=render/jobs/${{ matrix.id }}/job.json
          v=$(jq -r '.asr_model // (if (.asr_video_lang // "en") == "en" then "small.en" else "large-v3-turbo" end)' "$J")
          c=$(jq -r 'if (.asr_lang and ((.asr_clips // []) | length) > 0) then (.asr_clip_model // (if .asr_lang == "en" then "small.en" else "large-v3-turbo" end)) else "" end' "$J")
          echo "key=$(echo "$v $c" | xargs | tr ' ' '+')" >> "$GITHUB_OUTPUT"
      - name: Cache whisper
        if: steps.r.outputs.ok == '1'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/asr-pip
          key: whisper-v1-${{ steps.am.outputs.key }}
      - name: Cloud ASR
        if: steps.r.outputs.ok == '1'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          pip install -q --retries 5 --cache-dir ~/.cache/asr-pip faster-whisper==1.2.1
          J=render/jobs/${{ matrix.id }}/job.json
          python render/asr.py "${{ matrix.id }}" "${{ matrix.id }}.mp4" "$J"
      - name: Push result
        if: always()
        run: |
          mkdir -p render/done
          tail -c 4000 /tmp/log.txt 2>/dev/null | jq -Rs --arg id "${{ matrix.id }}" --arg ok "${{ steps.r.outputs.ok }}" --arg rc "${{ steps.r.outputs.rc }}" --arg secs "${{ steps.r.outputs.secs }}" --arg run "${{ github.run_id }}" \
            '{id:$id, ok:($ok=="1"), rc:$rc, secs:$secs, run:$run, log:.}' > "render/done/${{ matrix.id }}.json"
          git config user.name "reels-bot"; git config user.email "reels-bot@users.noreply.github.com"
          git add --sparse "render/done/${{ matrix.id }}.json"
          [ -f "${{ matrix.id }}.mp4" ] && git add --sparse "${{ matrix.id }}.mp4" "render/out/${{ matrix.id }}_540.mp4"
          for f in render/done/${{ matrix.id }}.asr*; do
            if [ -f "$f" ]; then git add --sparse "$f" || true; fi
          done
          git commit -q -m "Rendered ${{ matrix.id }}"
          for i in 1 2 3 4 5 6 7 8; do
            git -c gc.auto=0 pull -q --rebase -X theirs && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 10) + 5 ))
          done
          exit 1
