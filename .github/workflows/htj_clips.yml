name: htj-clips
# Free-licence video b-roll from Wikimedia Commons for the hate_the_jews reels (the container cannot reach Commons).
# templates/clips/htj_list.txt lines: "name File:Title.webm start dur [xoff]"  ->  templates/clips/htj/<name>.mp4
# (720x1280 vertical centre crop at xoff 0..1, 30 fps, no audio) + templates/clips/htj/<name>.json (licence, author).
on:
  push:
    paths: ['templates/clips/htj_list.txt', '.github/workflows/htj_clips.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: htj-clips
  cancel-in-progress: false
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            templates/clips
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Fetch and cut
        run: |
          mkdir -p templates/clips/htj
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.parse, urllib.request
          UA = {"User-Agent": "reels-drop-clips/1.0 (https://github.com/avinoamroz/reels-drop)"}
          def api(title):
              q = urllib.parse.urlencode(dict(action="query", format="json", titles=title, prop="imageinfo", iiprop="url|extmetadata"))
              r = urllib.request.urlopen(urllib.request.Request("https://commons.wikimedia.org/w/api.php?" + q, headers=UA), timeout=60)
              pg = next(iter(json.load(r)["query"]["pages"].values())); ii = pg["imageinfo"][0]
              md = {k: v.get("value") for k, v in ii.get("extmetadata", {}).items()}
              strip = lambda s: re.sub(r"\s+", " ", re.sub(r"<[^>]+>", "", s or "")).strip()
              return ii["url"], dict(title=title, page=ii.get("descriptionurl"), license=strip(md.get("LicenseShortName")),
                                     author=strip(md.get("Artist"))[:120], date=strip(md.get("DateTimeOriginal"))[:40])
          for line in open("templates/clips/htj_list.txt", encoding="utf-8"):
              p = line.split()
              if len(p) < 4 or line.startswith("#"): continue
              name, title, start, dur = p[0], p[1].replace("_", " "), p[2], p[3]; x = p[4] if len(p) > 4 else "0.5"
              out = f"templates/clips/htj/{name}.mp4"
              if os.path.exists(out) or (start == "probe" and os.path.exists(f"templates/clips/htj/probe_{name}.jpg")): continue
              try:
                  url, meta = api(title)
                  src = "/tmp/src_" + name
                  if not os.path.exists(src):
                      subprocess.run(["curl", "-sSL", "--fail", "-A", UA["User-Agent"], "-o", src, url], check=True)
                  if start == "probe":
                      d = float(subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", src], capture_output=True, text=True).stdout.strip() or 0)
                      tiles = []
                      for i in range(12):
                          tt = d * (i + 0.5) / 12; jp = f"/tmp/p_{name}_{i}.jpg"
                          subprocess.run(["ffmpeg", "-nostdin", "-v", "error", "-y", "-ss", f"{tt:.2f}", "-i", src, "-frames:v", "1", "-vf",
                                          f"scale=320:-2,drawtext=text='{tt:.1f}':x=5:y=5:fontsize=22:fontcolor=yellow:box=1:boxcolor=black", jp])
                          tiles.append(jp)
                      subprocess.run(["ffmpeg", "-nostdin", "-v", "error", "-y", *sum([["-i", x] for x in tiles], []), "-filter_complex",
                                      "".join(f"[{i}:v]scale=320:180,setsar=1[v{i}];" for i in range(12)) + "".join(f"[v{i}]" for i in range(12)) + "xstack=inputs=12:layout=" +
                                      "|".join(f"{(i % 4) * 320}_{(i // 4) * 180}" for i in range(12)), "-frames:v", "1", f"templates/clips/htj/probe_{name}.jpg"], check=True)
                      meta["duration"] = d; json.dump(meta, open(f"templates/clips/htj/probe_{name}.json", "w"), indent=1, ensure_ascii=False); print("probe", name, d)
                      continue
                  vf = f"scale=-2:1280:flags=lanczos,crop=min(iw\\,720):1280:(iw-min(iw\\,720))*{x}:0,scale=720:1280,fps=30,format=yuv420p"
                  subprocess.run(["ffmpeg", "-nostdin", "-v", "error", "-y", "-ss", start, "-i", src, "-t", dur, "-vf", vf, "-an",
                                  "-c:v", "libx264", "-crf", "23", "-preset", "medium", out], check=True)
                  meta["cut"] = dict(start=start, dur=dur, xoff=x)
                  json.dump(meta, open(f"templates/clips/htj/{name}.json", "w"), indent=1, ensure_ascii=False); print("ok", name, meta["license"])
              except Exception as e:
                  json.dump(dict(title=title, error=str(e)[:300]), open(f"templates/clips/htj/{name}.json", "w")); print("FAIL", name, e)
          PY
          ls -la templates/clips/htj
      - name: Commit
        run: |
          git config user.name "reels-bot"; git config user.email "reels-bot@users.noreply.github.com"
          git add --sparse templates/clips/htj
          git diff --cached --quiet && exit 0
          git commit -q -m "htj clips [skip ci]"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase && git push -q && exit 0
            sleep $(( (RANDOM % 10) + 5 ))
          done
          exit 1
