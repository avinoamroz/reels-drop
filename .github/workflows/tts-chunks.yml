name: tts-chunks
# Long narration voiced in chapters (tools/tts_chunks.py): push voice/chunks/<id>.json -> voice/<id>_vo.wav + _words.json + .hash
# (a cached voice for spec-render) and voice/<id>_chunks_report.json (pitch and rate per chunk). Nothing here posts anything.
on:
  push:
    paths: ['voice/chunks/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tts-chunks
  cancel-in-progress: false
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/tts_chunks.py
            /voice/chunks/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg libsndfile1 > /dev/null
          pip install -q --retries 5 numpy soundfile requests librosa
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q rubberband && echo "rubberband ok" || echo "no rubberband"
      - name: Voice
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        run: |
          for f in voice/chunks/*.json; do
            id=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['id'])" "$f")
            git sparse-checkout add "/voice/${id}_vo.hash" "/voice/${id}_chunks_report.json" || true
            python3 tools/tts_chunks.py "$f"
          done
      - name: Commit
        run: |
          git config user.name "reels-bot"; git config user.email "reels-bot@users.noreply.github.com"
          git add --sparse -f voice/*_vo.wav voice/*_vo_words.json voice/*_vo.hash voice/*_chunks_report.json 2>/dev/null || true
          git -c gc.auto=0 commit -q -m "tts-chunks: voice" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5 6 7 8; do
            git -c gc.auto=0 pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 15) + 5 ))
          done
          exit 1
