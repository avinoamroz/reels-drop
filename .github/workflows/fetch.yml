name: fetch-heygen
on:
  push:
    paths: ['heygen/fetch.txt', 'heygen/drive.txt', 'voice/drive.txt', '.github/workflows/fetch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download listed HeyGen videos (name video_id)
        run: |
          while read -r name vid; do
            [ -z "$name" ] && continue
            [ -f "heygen/$name" ] && continue
            path=$(curl -sSL "https://app.heygen.com/videos/$vid" | grep -o "transcode/$vid/v[0-9a-f]\{32\}" | head -1)
            echo "$name -> $path"
            [ -z "$path" ] && continue
            curl -sSL --fail -o "heygen/$name" "https://resource2.heygen.ai/video/$path/1080x1920_nocap.mp4"
          done < heygen/fetch.txt
          ls -la heygen
      - name: Download public Drive files (name file_id)
        run: |
          touch heygen/drive.txt
          while read -r name fid; do
            [ -z "$name" ] && continue
            [ -f "heygen/$name" ] && continue
            curl -sSL --fail -o "heygen/$name" "https://drive.usercontent.google.com/download?id=$fid&export=download&confirm=t"
          done < heygen/drive.txt
          ls -la heygen
      - name: Voice from Drive (voice/drive.txt "name file_id"; .txt = TTS1 sse, parsed to wav + words)
        continue-on-error: true
        run: |
          mkdir -p voice; touch voice/drive.txt
          grep -v '^#' voice/drive.txt | while read -r name fid; do
            [ -z "$name" ] && continue
            base="${name%.*}"
            case "$name" in
              *.txt) [ -f "voice/$base.wav" ] && continue ;;
              *) [ -f "voice/$name" ] && continue ;;
            esac
            rm -f "voice/$base.err"
            if ! curl -sSL --fail -o "/tmp/$name" "https://drive.usercontent.google.com/download?id=$fid&export=download&confirm=t"; then
              echo "download failed" > "voice/$base.err"; continue
            fi
            if head -c 600 "/tmp/$name" | grep -qi "<html"; then
              echo "got an HTML page: file is not viewable by link (run Make IG3 4985693 on it)" > "voice/$base.err"; continue
            fi
            case "$name" in
              *.txt) python3 tools/sse_parse.py "/tmp/$name" "voice/$base" > "voice/$base.log" 2>&1 || mv "voice/$base.log" "voice/$base.err" ;;
              *) mv "/tmp/$name" "voice/$name" ;;
            esac
          done
          ls -la voice
      - name: Commit
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add -A heygen || true
          [ -d voice ] && { git add -A voice || true; }
          git diff --cached --quiet || (git commit -m "Fetch HeyGen clips" && git pull --rebase && git push)
