name: frames
on:
  push:
    paths: ['frames/list.txt', '.github/workflows/frames.yml']
permissions:
  contents: write
jobs:
  frames:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Grab frames
        run: |
          curl -sSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/frames/list.txt" -o list.txt
          gh release view frames -R ${{ github.repository }} >/dev/null 2>&1 || gh release create frames --title frames --notes frames -R ${{ github.repository }}
          have=$(gh release view frames -R ${{ github.repository }} --json assets --jq '.assets[].name' || true)
          mkdir -p out
          i=0
          while read -r k fid; do
            [ -z "$k" ] && continue
            i=$((i+1)); n="${k}_${fid:0:6}"
            echo "$have" | grep -qx "$n.jpg" && continue
            u="https://drive.usercontent.google.com/download?id=$fid&export=download&confirm=t"
            d=$(timeout 120 ffprobe -v error -show_entries format=duration -of csv=p=0 "$u" </dev/null | cut -d. -f1)
            echo "$n dur=$d"
            [ -z "$d" ] && continue
            for p in 10 25 45 65 85; do
              t=$((d*p/100))
              timeout 180 ffmpeg -nostdin -v error -y -ss $t -i "$u" -frames:v 1 -vf "scale='if(gt(iw,ih),640,-2)':'if(gt(iw,ih),-2,640)'" "out/${n}_$p.jpg" </dev/null || true
            done
            ls out/${n}_*.jpg >/dev/null 2>&1 || continue
            ffmpeg -nostdin -v error -y $(for f in out/${n}_*.jpg; do echo -i $f; done) -filter_complex "$(c=0; s=''; for f in out/${n}_*.jpg; do s="$s[$c:v]scale=320:-2,pad=320:570:0:0[v$c];"; c=$((c+1)); done; echo -n "$s"; for j in $(seq 0 $((c-1))); do echo -n "[v$j]"; done; echo "hstack=inputs=$c")" "out/$n.jpg" </dev/null || cp $(ls out/${n}_*.jpg | head -1) out/$n.jpg
            gh release upload frames "out/$n.jpg" --clobber -R ${{ github.repository }} </dev/null
          done < list.txt
