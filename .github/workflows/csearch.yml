name: csearch
on:
  push:
    paths: ['photos/search_req.txt', 'tools/csearch.py', '.github/workflows/csearch.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: csearch
  cancel-in-progress: false
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            photos/search_req.txt
            photos/search
            tools/csearch.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q --retries 5 requests
      - run: python tools/csearch.py
      - name: Commit
        run: |
          git config user.name "reels-bot"; git config user.email "reels-bot@users.noreply.github.com"
          git add --sparse photos/search
          git diff --cached --quiet && exit 0
          git commit -q -m "Commons search [skip ci]"
          for i in 1 2 3 4 5 6; do
            git -c gc.auto=0 pull -q --rebase -X theirs && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 10) + 5 ))
          done
          exit 1
