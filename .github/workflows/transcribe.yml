name: transcribe
on:
  push:
    paths: ['heygen/transcribe.txt', 'tools/tx.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install faster-whisper==1.0.3
      - name: Word timestamps
        run: python tools/tx.py || true
      - run: |
          git config user.name "reels-bot"; git config user.email "reels-bot@users.noreply.github.com"
          git add heygen/*.words.json heygen/tx.log || true
          git diff --cached --quiet || (git commit -m "Word timestamps" && git pull --rebase && git push)
