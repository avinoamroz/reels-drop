name: cut
on:
  push:
    paths: ['cut/list.txt', '.github/workflows/cut.yml']
permissions:
  contents: write
jobs:
  cut:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Cut segments to release "cuts"
        run: |
          curl -sSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/cut/list.txt" -o list.txt
          gh release view cuts -R ${{ github.repository }} >/dev/null 2>&1 || gh release create cuts --title cuts --notes cuts -R ${{ github.repository }}
          have=$(gh release view cuts -R ${{ github.repository }} --json assets --jq '.assets[].name' || true)
          mkdir -p out
          grep -v '^#' list.txt | while read -r n fid s e; do
            [ -z "$n" ] && continue
            echo "$have" | grep -qx "$n.mp4" && continue
            [ -f "/tmp/$fid" ] || curl -sSL --fail </dev/null -o "/tmp/$fid" "https://drive.usercontent.google.com/download?id=$fid&export=download&confirm=t" || continue
            ffmpeg -nostdin -v error -y -ss "$s" -to "$e" -i "/tmp/$fid" -vf "scale='if(gt(iw,ih),1280,-2)':'if(gt(iw,ih),-2,1280)'" -c:v libx264 -crf 22 -preset veryfast -c:a aac -b:a 160k "out/$n.mp4" && gh release upload cuts "out/$n.mp4" --clobber -R ${{ github.repository }} </dev/null
          done
