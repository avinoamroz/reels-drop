name: cut
on:
  push:
    paths: ['cut/list.txt', '.github/workflows/cut.yml']
permissions:
  contents: write
jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Cut segments
        run: |
          grep -v '^#' cut/list.txt | while read -r n fid s e; do
            [ -z "$n" ] && continue
            [ -f "cut/$n.mp4" ] && continue
            [ -f "/tmp/$fid" ] || curl -sSL --fail -o "/tmp/$fid" "https://drive.usercontent.google.com/download?id=$fid&export=download&confirm=t" || { echo fail > cut/$n.err; continue; }
            ffmpeg -v error -y -ss "$s" -to "$e" -i "/tmp/$fid" -vf "scale='if(gt(iw,ih),1280,-2)':'if(gt(iw,ih),-2,1280)'" -c:v libx264 -crf 22 -preset veryfast -c:a aac -b:a 160k "cut/$n.mp4" || echo fail > cut/$n.err
          done
          ls -la cut
      - run: |
          git config user.name "reels-bot"; git config user.email "reels-bot@users.noreply.github.com"
          git add cut
          git diff --cached --quiet || (git commit -m "cut segments" && git pull --rebase -q && git push -q)
