name: he-voice
# Hebrew voice jobs (20 Nov 2026): Cartesia Hebrew voice list, Dicta Nakdan test, Noam's Hebrew sample (from public
# Drive copies of his own Hebrew reels), voice auditions scored by Hebrew ASR, the "Noam Roz - Hebrew" clone.
# Push hevoice/jobs.json to run. Results: hevoice/*.json, wav cuts in hevoice/ and ref/. Nothing is posted.
on:
  push:
    paths: ['hevoice/jobs.json']
permissions:
  contents: write
jobs:
  he:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /templates/core/
            /templates/lexicon_en.json
            /templates/lexicon_he.json
            /templates/voices.json
            /templates/opener/hook.py
            /tools/he_voice.py
            /hevoice/
            /ref/noam_he_sample*
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: he-voice-v1
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg libcairo2-dev pkg-config libsndfile1 > /dev/null
          pip install -q requests numpy soundfile num2words python-bidi pillow opencv-python-headless pycairo faster-whisper==1.2.1
          if grep -q '"ipa"' hevoice/jobs.json; then sudo apt-get install -y -qq espeak-ng > /dev/null; pip install -q torch --extra-index-url https://download.pytorch.org/whl/cpu; pip install -q transformers==4.44.2 phonemizer; fi
      - env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        run: python -u tools/he_voice.py
      - if: always()
        run: |
          git config user.name "reels-bot"; git config user.email "reels-bot@users.noreply.github.com"
          for f in hevoice/*.json hevoice/*.wav ref/noam_he_sample*.wav; do [ -f "$f" ] && git add --sparse -f "$f"; done; true
          git -c gc.auto=0 commit -q -m "he-voice: results" || exit 0
          for i in 1 2 3 4 5 6; do git -c gc.auto=0 pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((RANDOM % 10 + 5)); done
