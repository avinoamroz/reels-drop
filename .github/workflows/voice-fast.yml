name: voice-fast
on:
  push:
    paths: ['voice/fast.txt', '.github/workflows/voice-fast.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Voice from Drive (voice/fast.txt "name.txt file_id", TTS1 sse)
        run: |
          mkdir -p voice; touch voice/fast.txt
          grep -v '^#' voice/fast.txt | while read -r name fid; do
            [ -z "$name" ] && continue
            base="${name%.*}"
            case "$name" in *.txt) ;; *) [ -f "voice/$name" ] || curl -sSL --fail -o "voice/$name" "https://drive.usercontent.google.com/download?id=$fid&export=download&confirm=t"; continue ;; esac
            [ -f "voice/$base.wav" ] && continue
            curl -sSL --fail -o "/tmp/$name" "https://drive.usercontent.google.com/download?id=$fid&export=download&confirm=t" || { echo "download failed" > "voice/$base.err"; continue; }
            python3 tools/sse_parse.py "/tmp/$name" "voice/$base" > "voice/$base.log" 2>&1 || mv "voice/$base.log" "voice/$base.err"
          done
      - name: Commit
        run: |
          git config user.name "reels-bot"; git config user.email "reels-bot@users.noreply.github.com"
          git add -A voice || true
          git diff --cached --quiet || (git commit -m "Fetch voice (fast)" && for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 10 + 5)); done)
