<style>
/* Layout: a top-down map of Israel's coast zoomed on Gush Dan; companies stand as small towers at their city, people commute to them, far-away companies point in from the map edge. Filters above, stats beside, cards slide up. */
:root{
 --bg:#EDF2F6;--fg:#12203A;--mute:#5A6A80;--card:#FFFFFF;--line:#D5DDE7;
 --navy:#163261;--sky:#45A4DD;--yel:#F5C518;--bad:#D2453A;--good:#1F9D5B;--warn:#E08A00;

 --lv0:#98A3B3;--lv1:#22A35A;--lv2:#F2BC00;--lv3:#E0402F;
 --sea:#A9D4EC;--sea2:#C9E5F4;--land:#F3EFE4;--land2:#E9E3D3;--urban:#E4DDCB;--sand:#EFDDAE;--road:#FFFFFF;--road2:#F2C35B;--roadedge:#D6CDB8;--river:#7FBDE0;--park:#CFE5BE;--hill:#E2DAC3;--shallow:#C4E6F3;--block:#DDD4BF;--block2:#D3C9B2;--shield:#1F5FA8;
 --gA:#8DB8D6;--gB:#A9C6D8;--gC:#7FA6C4;--mA:#C9D3DE;--mB:#B9C7D6;--bA:#F7F3EA;--bB:#ECE5D6;--bC:#F1E7D6;
 --win:#3A5272;--head:#F2E2D0;--ink:#12203A;--halo:#FFFFFF;--cityfg:#5B5040;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0B1322;--fg:#E7EDF6;--mute:#95A4BA;--card:#131E33;--line:#24324C;
 --cT:#A58BF5;--cE:#F5A04F;--cK:#EE77A8;--cN:#5DB3EA;--cO:#7E8899;
 --lv0:#8794A8;--lv1:#3CC474;--lv2:#FFCC2E;--lv3:#FF5A48;
 --sea:#0C2440;--sea2:#123256;--land:#1A2232;--land2:#1F293B;--urban:#232D40;--sand:#3A3426;--road:#3A4559;--road2:#8A6A2A;--roadedge:#2A3446;--river:#1D4C73;--park:#1D3A2A;--hill:#212B3C;--shallow:#123A5E;--block:#2A3549;--block2:#323E54;--shield:#2C6CB8;

 --win:#FFD46A;--head:#E8D3BE;--ink:#0B1322;--halo:#0B1322;--cityfg:#B7AE9C;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0B1322;--fg:#E7EDF6;--mute:#95A4BA;--card:#131E33;--line:#24324C;
 --cT:#A58BF5;--cE:#F5A04F;--cK:#EE77A8;--cN:#5DB3EA;--cO:#7E8899;
 --lv0:#8794A8;--lv1:#3CC474;--lv2:#FFCC2E;--lv3:#FF5A48;
 --sea:#0C2440;--sea2:#123256;--land:#1A2232;--land2:#1F293B;--urban:#232D40;--sand:#3A3426;--road:#3A4559;--road2:#8A6A2A;--roadedge:#2A3446;--river:#1D4C73;--park:#1D3A2A;--hill:#212B3C;--shallow:#123A5E;--block:#2A3549;--block2:#323E54;--shield:#2C6CB8;
 --gA:#2D5A80;--gB:#35668C;--gC:#284F72;--mA:#3A4762;--mB:#33405A;--bA:#3A4458;--bB:#424C61;--bC:#384256;
 --win:#FFD46A;--head:#E8D3BE;--ink:#0B1322;--halo:#0B1322;--cityfg:#B7AE9C;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:15px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-d);font-weight:800;font-size:clamp(28px,5vw,44px);line-height:1;margin:0;letter-spacing:-.01em}
h1 span{color:var(--sky)}
.sub{color:var(--mute);margin:6px 0 0;font-size:14px;max-width:72ch}
.src{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}
.dot.on{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.btn:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible,.li:focus-visible,canvas:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.bar1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:14px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 13px 6px 9px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip i{width:14px;height:14px;border-radius:4px;display:inline-block}
.chip i.hat{border-radius:7px 7px 2px 2px}
.chip[aria-pressed="false"]{opacity:.42}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
select,input[type=search]{font:inherit;font-size:14px;background:var(--card);color:var(--fg);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;min-width:0;max-width:100%}
input[type=search]{width:220px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}
.map{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}
canvas{display:block;width:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:40px;height:36px;padding:0;font-size:18px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.zoom .btn.t{font-size:11px;font-weight:600}
.note{font-size:12px;color:var(--mute);padding:8px 14px;border-top:1px solid var(--line)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.stat h3{margin:0 0 8px;font-family:var(--f-d);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.rows{display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.row i{width:11px;height:11px;border-radius:3px}
.row i.hat{border-radius:6px 6px 2px 2px}
.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{grid-column:2/4;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:-1px 0 3px}
.track b{display:block;height:100%}
.li{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:5px 7px;border-radius:8px;cursor:pointer;font-size:14px;font-variant-numeric:tabular-nums}
.li:hover,.li[aria-pressed="true"]{background:color-mix(in srgb,var(--sky) 14%,transparent)}
.li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li em{font-style:normal;color:var(--mute);font-size:13px}
.colist{display:flex;flex-direction:column;gap:1px;max-height:300px;overflow:auto}
.gap{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.gap b{color:var(--fg);font-weight:600}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 32px));max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.22);padding:16px 18px;z-index:20}
.pop h4{margin:0 70px 0 0;font-family:var(--f-d);font-size:22px;font-weight:800;line-height:1.15}
.pop .who{font-size:13px;color:var(--mute);margin:3px 0 10px}
.pop .x{position:absolute;top:10px;inset-inline-end:10px}
[dir=rtl] .pop h4{margin:0 0 0 70px}
.zoom .btn.t{width:auto;min-width:40px;padding:0 6px}
.pop .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:14px;font-variant-numeric:tabular-nums;margin:0}
.pop .kv dt{color:var(--mute)}
.pop .kv dd{margin:0}
.prog{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin:4px 0 2px}
.prog span{display:block;height:100%;background:var(--sky)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:6px 0 10px}
.stack span{display:block;height:100%}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:middle}
.pill.mv{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.sl{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.st{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.lvl{display:inline-flex;align-items:center;gap:6px}
.lvl i{width:11px;height:11px;border-radius:6px 6px 2px 2px;display:inline-block}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.plist{display:flex;flex-direction:column;gap:1px;margin-top:4px}
.plist .li{grid-template-columns:12px minmax(0,1fr) auto}
.plist i{width:10px;height:10px;border-radius:3px;align-self:center}
.red{color:var(--bad)}
.loc{font-size:13px;color:var(--mute);margin:-4px 0 10px}
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ask label{font-family:var(--f-d);font-weight:800;font-size:18px}
.ask input{width:220px;max-width:100%}
.ask label{margin-inline-start:6px}
.big{display:flex;align-items:baseline;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
.big b{font-family:var(--f-d);font-weight:800;font-size:44px;line-height:1;color:var(--sky);font-variant-numeric:tabular-nums}
.big span{font-size:16px;font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:10px 0 2px}
.stats div{display:flex;align-items:baseline;gap:6px}
.stats span:first-child{color:var(--fg);font-size:18px;font-weight:700}
.stats b{font-family:var(--f-d);font-weight:800;font-size:34px;color:var(--sky);font-variant-numeric:tabular-nums}
.stats span{font-size:14px;color:var(--mute);font-weight:600}
.cta{display:block;text-align:center;background:var(--navy);color:#FFFFFF;text-decoration:none;font-weight:600;border-radius:12px;padding:10px 14px}
.cta:hover{filter:brightness(1.1)}
.cta:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
@media (max-width:520px){input[type=search]{width:100%}.ctl{width:100%}.ctl>*{flex:1 1 140px}}

/* mobile-first layout */
.wrap{max-width:1100px;gap:14px;padding-block:14px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:clamp(26px,7vw,40px)}
.btn.ghost{background:transparent}
.hero{display:flex;flex-direction:column;gap:6px}
.stats{margin:0}
.stats div{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.stats span:first-child{font-size:16px;color:var(--mute);font-weight:600}
.stats b{font-size:clamp(56px,17vw,92px);line-height:.95;letter-spacing:-.02em;color:var(--fg)}
.stats b+span{font-family:var(--f-d);font-size:clamp(20px,5.4vw,28px);font-weight:800;color:var(--sky);line-height:1.15}
.sub{font-size:15px;margin:4px 0 0}
.ask{flex-direction:column;align-items:stretch;gap:10px;padding:10px;border-radius:18px;box-shadow:0 6px 24px rgba(10,30,60,.08)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.tab{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--mute);border-radius:9px;padding:8px 6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 4px rgba(10,30,60,.12)}
.tab:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.field input{width:100%;font-size:17px;padding:12px 16px;border-radius:14px}
.ask input{width:100%}
.map{border-radius:20px}
.zoom{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));right:10px}
.zoom .btn{width:38px;height:34px}
.note{border:0;padding:0 4px;margin:-4px 0 0;text-align:center}
.top10 h3{margin:0 0 10px;font-family:var(--f-d);font-weight:800;font-size:20px}
.chips2{display:flex;flex-wrap:wrap;gap:8px}

.chips2 .li em{font-style:normal;font-weight:700;color:var(--sky)}
.cta.main{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;padding:14px 16px;font-size:16px;border-radius:16px;box-shadow:0 10px 30px rgba(10,30,60,.25);max-width:560px;margin:0 auto}
@media (max-width:640px){
 .map{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));border-radius:0;border-inline:0}

 .zoom #zin,.zoom #zout{display:none}

}

/* compact pass */
.wrap{gap:10px;padding-block:10px 84px}
.top h1{font-size:20px;letter-spacing:0}
.btn.ghost{font-size:12px;padding:4px 10px}
.stats{font-family:var(--f-d);font-size:clamp(17px,4.6vw,22px);font-weight:700;line-height:1.3;margin:0;color:var(--fg);display:block}
.stats b{font-size:1.45em;font-weight:800;color:var(--sky);letter-spacing:-.01em;line-height:1}
.ask{padding:6px;gap:6px;border-radius:14px;box-shadow:none}
.tabs{padding:3px;border-radius:10px}
.tab{font-size:13px;padding:6px 4px}
.field input{font-size:16px;padding:9px 14px;border-radius:11px}
.note{font-size:11px}
.top10 h3{font-size:15px;margin:0 0 8px}
.chips2{gap:6px}
.chips2 .li{font-size:13px;padding:5px 10px}
.cta.main{padding:11px 14px;font-size:15px;border-radius:14px}

.crowdT{font-family:var(--f-d);font-weight:800;font-size:15px;margin:2px 0 8px}
.crowd{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:10px 6px;margin-bottom:6px}
.pp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;text-align:center;line-height:1.15;animation:pop .35s ease both;animation-delay:var(--d)}
.pp i{position:relative;width:30px;height:34px;display:block}
.pp i::before{content:"";position:absolute;left:50%;top:0;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--head)}
.pp i::after{content:"";position:absolute;left:50%;bottom:0;width:26px;height:18px;margin-left:-13px;border-radius:13px 13px 6px 6px;background:var(--pc,var(--sky))}
.pp.ka i::before{background:var(--line)}.pp.ka i::after{background:var(--line)}
.pp.ka span{color:var(--mute)}
.pp.kx i::before{background:var(--fg)}.pp.kx i::after{background:var(--fg)}
.pp.kx span{background:var(--fg);color:var(--card);padding:1px 5px;border-radius:3px;letter-spacing:.04em}
.pp.more i{font-style:normal;font-weight:800;color:var(--mute);display:grid;place-items:center;font-size:13px}
.pp.more i::before,.pp.more i::after{display:none}
.crowdN{font-size:11px;color:var(--mute);margin:0 0 10px}
.pp i b{position:absolute;right:-7px;bottom:-3px;width:19px;height:19px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;line-height:1;font-style:normal;z-index:1;box-shadow:0 1px 3px rgba(0,0,0,.15)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pp{animation:none}}
</style>

cv.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);
 if(ptrs.size===1){const dx=e.offsetX-prev[0],dy=e.offsetY-prev[1];moved+=Math.abs(dx)+Math.abs(dy);if(moved>5){cv.classList.add("drag");follow=false;cam.x-=dx/cam.z;cam.y-=dy/cam.z;dirty=true;}}
 else if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,pinch.z*d/pinch.d/cam.z);moved=99;}});

function applyLang(){
